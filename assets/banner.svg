<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Styles -->
    <style>
      .flow-line {
        stroke-dasharray: 10, 15;
        animation: flowDash 30s linear infinite;
      }
      @keyframes flowDash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      .node-pulse {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.96); opacity: 0.6; }
        100% { transform: scale(1.04); opacity: 1; }
      }
      .orbit-1 {
        animation: spin 20s linear infinite;
        transform-origin: 980px 180px;
      }
      .orbit-2 {
        animation: spinRev 25s linear infinite;
        transform-origin: 980px 180px;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      .particle {
        animation: float 6s ease-in-out infinite alternate;
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Light Orbs (Background only) -->
  <circle cx="200" cy="180" r="160" fill="url(#glowGrad)" />
  <circle cx="980" cy="180" r="200" fill="url(#glowGrad)" opacity="0.7" />

  <!-- Dynamic / Animated Flow Connections (Background to Midground) -->
  <g opacity="0.45">
    <path class="flow-line" d="M -50 280 Q 250 320, 500 240 T 980 180" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M -50 100 Q 300 40, 650 140 T 1250 120" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <path class="flow-line" d="M 400 360 Q 650 200, 980 180" fill="none" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Graphic Ecosystem Art on the Right Side (Behind Text Overlay) -->
  <g transform="translate(0, 0)">
    <!-- Outer Orbit Ring -->
    <circle cx="980" cy="180" r="110" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6" />
    <!-- Inner Orbit Ring -->
    <circle cx="980" cy="180" r="70" fill="none" stroke="#475569" stroke-width="1" />

    <!-- Rotating Connected Nodes Ring 1 -->
    <g class="orbit-1">
      <g transform="translate(980, 70)">
        <circle r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <text y="4" font-size="10" fill="#38bdf8" font-weight="bold" text-anchor="middle">CASB</text>
      </g>
      <g transform="translate(1090, 180)">
        <circle r="16" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
        <text y="4" font-size="10" fill="#818cf8" font-weight="bold" text-anchor="middle">ZTNA</text>
      </g>
      <g transform="translate(980, 290)">
        <circle r="16" fill="#1e293b" stroke="#c084fc" stroke-width="2" />
        <text y="4" font-size="10" fill="#c084fc" font-weight="bold" text-anchor="middle">SSPM</text>
      </g>
      <g transform="translate(870, 180)">
        <circle r="16" fill="#1e293b" stroke="#34d399" stroke-width="2" />
        <text y="4" font-size="9" fill="#34d399" font-weight="bold" text-anchor="middle">OAuth</text>
      </g>
    </g>

    <!-- Rotating Nodes Ring 2 (Opposite direction) -->
    <g class="orbit-2">
      <circle cx="1030" cy="130" r="6" fill="#38bdf8" opacity="0.8" />
      <circle cx="930" cy="230" r="5" fill="#f43f5e" opacity="0.8" />
      <circle cx="1030" cy="230" r="5" fill="#fbbf24" opacity="0.8" />
      <circle cx="930" cy="130" r="6" fill="#a855f7" opacity="0.8" />
    </g>

    <!-- Central Shield Node (Core Security Anchor) -->
    <g transform="translate(980, 180)" class="node-pulse">
      <circle r="42" fill="#0f172a" stroke="url(#titleGrad)" stroke-width="3" filter="url(#glow)" />
      <!-- Shield Icon SVG -->
      <path d="M -14 -12 L 0 -18 L 14 -12 L 14 4 C 14 15, 0 22, 0 22 C 0 22, -14 15, -14 4 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <path d="M -4 2 L -1 5 L 6 -3" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Foreground Dynamic Visual Badges / Status Pills (Kept below title/subtitle) -->
  <g transform="translate(80, 275)">
    <!-- Pill 1: OAuth Token Risk -->
    <g class="particle" style="animation-delay: 0s;">
      <rect x="0" y="0" width="168" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="18" cy="17" r="5" fill="#38bdf8" />
      <text x="32" y="21" font-size="12" font-weight="600" fill="#f1f5f9">OAuth Governance</text>
    </g>

    <!-- Pill 2: SaaS Supply Chain -->
    <g class="particle" style="animation-delay: 1.5s;" transform="translate(182, 0)">
      <rect x="0" y="0" width="180" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="18" cy="17" r="5" fill="#818cf8" />
      <text x="32" y="21" font-size="12" font-weight="600" fill="#f1f5f9">SaaS Supply Chain</text>
    </g>

    <!-- Pill 3: Zero Trust Access -->
    <g class="particle" style="animation-delay: 3s;" transform="translate(376, 0)">
      <rect x="0" y="0" width="164" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.95" />
      <circle cx="18" cy="17" r="5" fill="#c084fc" />
      <text x="32" y="21" font-size="12" font-weight="600" fill="#f1f5f9">Zero Trust Access</text>
    </g>

    <!-- Pill 4: SSPM & CASB -->
    <g class="particle" style="animation-delay: 4.5s;" transform="translate(554, 0)">
      <rect x="0" y="0" width="140" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.95" />
      <circle cx="18" cy="17" r="5" fill="#34d399" />
      <text x="32" y="21" font-size="12" font-weight="600" fill="#f1f5f9">SSPM &amp; CASB</text>
    </g>
  </g>

  <!-- FOREGROUND: Category Tag, Main Title, and Subtitle (Crisp & Always on Top) -->
  <g transform="translate(80, 75)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="12" y="17" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED SECURITY ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="68" font-size="40" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Connected App Security
    </text>

    <!-- Subtitle -->
    <text x="0" y="106" font-size="16.5" font-weight="500" fill="#94a3b8">
      OAuth Token Governance • SaaS Supply Chain Risk • Zero Trust Access Architecture
    </text>

    <!-- Mini descriptor -->
    <text x="0" y="136" font-size="13" font-weight="400" fill="#64748b">
      The authoritative index of enterprise SaaS platforms and battle-tested open-source security tools.
    </text>
  </g>
</svg>
